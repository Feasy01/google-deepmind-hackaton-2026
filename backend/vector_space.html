        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.5.0.min.js" integrity="sha256-fHbNLP+GlIXN+efbQec78UkemUz3NJp7UmfGxC1tNxs=" crossorigin="anonymous"></script>                <div id="7706b50c-3393-4233-80cb-f11b1f2eb392" class="plotly-graph-div" style="height:800px; width:100%;"></div>            <script>                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("7706b50c-3393-4233-80cb-f11b1f2eb392")) {                    Plotly.newPlot(                        "7706b50c-3393-4233-80cb-f11b1f2eb392",                        [{"customdata":["\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #5\u003cbr\u003e\u003cbr\u003ewhere y is automaticity and x is day of the study. This\u003cbr\u003eequation has the advantage that the constants provide\u003cbr\u003epsychologically meaningful results: 'a' represents the\u003cbr\u003easymptote of the curve (the automaticity plateau score), 'b'\u003cbr\u003eis the difference between the asymptote and the modelled\u003cbr\u003einitial value of y (when x = 0) and 'c' is the rate constant\u003cbr\u003ethat represents the rate at which the maximum is reached","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #6\u003cbr\u003e\u003cbr\u003eWhen nonlinear regressions for curve-fitting were run for\u003cbr\u003eeach participant, a variety of different results were\u003cbr\u003eobtained. For 12 participants, SPSS was unable to find an\u003cbr\u003eoptimal solution after 100 iterations attempting to fit the\u003cbr\u003ecurve equation to the data. For 8 participants, the model\u003cbr\u003egenerated a zero value for 'b', indicating a horizontal line\u003cbr\u003eas the plotted shape for the data, which suggested","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #3\u003cbr\u003e\u003cbr\u003eHabit strength measured using the SRHI (or a subset of SRHI\u003cbr\u003eitems) has been shown to be associated with various eating\u003cbr\u003ebehaviours including snacking and fruit and vegetable\u003cbr\u003econsumption in adults, and sugar-sweetened beverage\u003cbr\u003econsumption in adolescents. Habit strength has also been\u003cbr\u003eshown to be predictive of physical activity in adults and\u003cbr\u003echildren. Although it has been suggested that the SRHI could","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #11\u003cbr\u003e\u003cbr\u003e*Journal of Applied Social Psychology*, 24, 285-300. -\u003cbr\u003eVerplanken, B., Myrbakk, V., & Rudi, E. (2005). The\u003cbr\u003emeasurement of habit. In T. Betsch & S. Haberstroh (Eds.),\u003cbr\u003e*The routines of decision making* (pp. 231-247). London:\u003cbr\u003eErlbaum. - Wood, W., & Neal, D. T. (2007). A new look at\u003cbr\u003ehabits and the habit-goal interface. *Psychological Review*,\u003cbr\u003e114, 843-863. - Wood, W., Quinn, J. M., & Kashy, D. A. (200","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #4\u003cbr\u003e\u003cbr\u003eThe study was advertised to university students through an\u003cbr\u003eemail circular. Interested participants (n = 101) attended\u003cbr\u003ean individual initial meeting, of whom 96 chose to\u003cbr\u003eparticipate in the study. A payment of 30 GBP was offered\u003cbr\u003efor participating in the full 12 weeks of the study but was\u003cbr\u003enot contingent on behaviour change or habit development.\u003cbr\u003e### Procedures  At the initial meeting, participants we","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #10\u003cbr\u003e\u003cbr\u003e- Ajzen, I. (2002). Residual effects of past on later\u003cbr\u003ebehavior: Habituation and reasoned action perspectives.\u003cbr\u003e*Personality and Social Psychology Review*, 6, 107-122. -\u003cbr\u003eArmitage, C. J. (2005). Can the theory of planned behavior\u003cbr\u003epredict the maintenance of physical activity? *Health\u003cbr\u003ePsychology*, 24, 235-245. - Bargh, J. A. (1994). The four\u003cbr\u003ehorsemen of automaticity: awareness, intention, efficiency,\u003cbr\u003ea","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #8\u003cbr\u003e\u003cbr\u003eAn asymptotic model proved to be a good fit for almost half\u003cbr\u003e(48%) of the participants who provided enough data for\u003cbr\u003eanalysis. Those for whom the asymptotic model was a poor fit\u003cbr\u003ehad typically carried out the behaviour fewer times during\u003cbr\u003ethe study. On average, the fit of the asymptotic curve was\u003cbr\u003esuperior to the linear model. We are therefore reasonably\u003cbr\u003econfident that the asymptotic curve reflects a g","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #0\u003cbr\u003e\u003cbr\u003e# How Are Habits Formed: Modelling Habit Formation in the\u003cbr\u003eReal World  **Source:** [https:\u002f\u002fonlinelibrary.wiley.com\u002fdoi\u003cbr\u003e\u002f10.1002\u002fejsp.674](https:\u002f\u002fonlinelibrary.wiley.com\u002fdoi\u002f10.10\u003cbr\u003e02\u002fejsp.674)  **Authors:** Phillippa Lally, Cornelia H. M.\u003cbr\u003evan Jaarsveld, Henry W. W. Potts, Jane Wardle\u003cbr\u003e**Institution:** University College London, London, UK\u003cbr\u003e**Journal:** European Journal of Social Psychology **40**,\u003cbr\u003e998","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #9\u003cbr\u003e\u003cbr\u003e- The sample of individuals with good curve fit was\u003cbr\u003erelatively small (N = 39), limiting power to examine\u003cbr\u003edifferences between participants. - There were days when\u003cbr\u003eparticipants did not enter their behaviour data due to\u003cbr\u003einconsistent website logging. - The SRHI is a self-report\u003cbr\u003emeasure that had never previously been used repeatedly as it\u003cbr\u003ewas in this study, though the lack of correlation between\u003cbr\u003enumber","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #7\u003cbr\u003e\u003cbr\u003eThe only significant correlation among curve parameters and\u003cbr\u003eperformance variables was between per cent compliance and\u003cbr\u003enonlinear model R-squared (r = .34, p = .035), indicating\u003cbr\u003ethat individuals who performed the behaviour more\u003cbr\u003econsistently showed a change in automaticity scores which\u003cbr\u003ewas modelled more closely by an asymptotic curve. Time to\u003cbr\u003ereach 95% asymptote and level of asymptote (a) were also s","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #1\u003cbr\u003e\u003cbr\u003eHistorically, habit has been measured by assessing the\u003cbr\u003efrequency of past behaviour (Sheeran, 2002; Ajzen, 2002).\u003cbr\u003eHowever, this assumes that the relationship between\u003cbr\u003erepetition and automaticity is linear, which is unlikely\u003cbr\u003ebecause it implies that every repetition, whether early on\u003cbr\u003ein the habit formation process or after a large number of\u003cbr\u003erepetitions, would result in the same increase in\u003cbr\u003eautomaticit","\u003cb\u003e\ud83d\udcc4 How Are Habits Formed Modelling Habit Formation In The Real World\u003c\u002fb\u003e\u003cbr\u003eChunk #2\u003cbr\u003e\u003cbr\u003eThe role of reinforcement\u002frewards in habit development and\u003cbr\u003emaintenance is unclear. In the behaviourist tradition, habit\u003cbr\u003estrength has been considered to be a function of repetition\u003cbr\u003eonly when rewards are received for performing the behaviour\u003cbr\u003eupon encountering a cue (Hull, 1943, 1951); without\u003cbr\u003ereinforcement there can be no habits. However, it is unclear\u003cbr\u003ewhether external rewards need to be provided af"],"hovertemplate":"%{customdata}\u003cextra\u003e\u003c\u002fextra\u003e","legendgroup":"articles","legendgrouptitle":{"text":"Articles"},"marker":{"color":"#6EE7B7","line":{"color":"white","width":0.5},"opacity":0.85,"size":7},"mode":"markers","name":"\ud83d\udcc4 How Are Habits Formed Modelling Habit Fo","x":{"dtype":"f4","bdata":"MkYbP2b4Fz\u002fiVRs\u002fIIYnPmATHD9w9Bs+fCYiP3tDDz83CSA\u002fW00ePyd0Jz+Hwgo\u002f"},"y":{"dtype":"f4","bdata":"+4IewTijHsFpmx3BJpsQwYY6HcHkFhHB\u002fYAewVJlHsEduB3Bhy8eweb1HMFMUxzB"},"type":"scatter"},{"customdata":["\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #9\u003cbr\u003e\u003cbr\u003eThese differences in upstream lymphatics examined ex vivo\u003cbr\u003ewere not accompanied by corresponding changes in scLV-1 or\u003cbr\u003escLV-2, where the diameter, lymphangion length and \u03b1SMA+\u003cbr\u003esmooth muscle coverage of the mid-lymphangion region were\u003cbr\u003esimilar in aged and younger adult mice. However, a small\u003cbr\u003ereduction (5.7%) was found in \u03b1SMA+ smooth muscle coverage\u003cbr\u003eof the perivalvular region of scLV-1 and scLV-2 in a","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #32\u003cbr\u003e\u003cbr\u003eFurther information on research design is available in the\u003cbr\u003eNature Portfolio Reporting Summary linked to this article.\u003cbr\u003e## Data availability  The scRNA-seq data of this study are\u003cbr\u003eavailable in the NCBI\u2019s Gene Expression Omnibus under\u003cbr\u003eaccession [GSM8493731](https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fgeo\u002fquer\u003cbr\u003ey\u002facc.cgi?acc=GSM8493731) (adult mice) and [GSM8493732](http\u003cbr\u003es:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fgeo\u002fquery\u002facc.cgi?acc=G","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #24\u003cbr\u003e\u003cbr\u003eTo quantify fluorescent tracers in CSF after mechanical\u003cbr\u003estimulation in adult *Prox1*\u2013GFP mice, TMR\u2013dextran was first\u003cbr\u003einfused into the lateral ventricle, as previously\u003cbr\u003edescribedand then the facial and neck skin was stimulated.\u003cbr\u003eCSF was collected through the cisterna magna 30\u2009min after\u003cbr\u003ethe initial infusion. A small hole was drilled at the\u003cbr\u003emedial\u2013lateral axis 1.5\u2009mm and anterior\u2013posterior axis\u003cbr\u003e\u22121.0\u2009mm","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #8\u003cbr\u003e\u003cbr\u003eTo learn the reason for the reduction in aged mice, we\u003cbr\u003ecompared the abundance and size of lymphatics in the scLV\u003cbr\u003epathway of aged mice to younger adults. The extent (area) of\u003cbr\u003ethe VEGFR3+ lymphatic network upstream to scLV-2 of aged\u003cbr\u003emice was approximately 80% less in the nasal mucosa and\u003cbr\u003e9\u201317% less in the hard palate plexus than in younger adults\u003cbr\u003e(Fig. 5). Lymphatics in the nasal mucosa were about t","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #28\u003cbr\u003e\u003cbr\u003eMorphometric measurements were made with ImageJ software\u003cbr\u003e(NIH) or Zen software (Carl Zeiss) on maximum-intensity-\u003cbr\u003eprojected confocal images. VEGFR3+ lymphatic area, LYVE1\u003cbr\u003esignal intensity, lymphatic vessel diameter and number of\u003cbr\u003elymphatic valves were measured on the submucosal side of the\u003cbr\u003ehard palate at the two ROIs: ROI-1 (greater palatine nerve\u003cbr\u003earea, 850\u2009\u03bcm\u2009\u00d7\u2009650\u2009\u03bcm), ROI-2 (near the CSF outflow","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #14\u003cbr\u003e\u003cbr\u003eTo determine whether mechanical stimulation of facial and\u003cbr\u003eneck skin increased CSF clearance from the SAS, instead of\u003cbr\u003ejust pushing lymph in scLV-1 and scLV-2 into cervical lymph\u003cbr\u003enodes, we injected TMR\u2013dextran into a lateral ventricle and\u003cbr\u003eapplied 10 1-min sessions of low-magnitude mechanical\u003cbr\u003estimulation (Fig. 6g). Measurements of CSF removed at the\u003cbr\u003ecisterna magna revealed a 23% lower concentration o","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #20\u003cbr\u003e\u003cbr\u003eTo assess CSF outflow through periorbital, nasal and hard\u003cbr\u003epalate lymphatics to scLVs and lymph nodes, 1\u2009\u03bcl of\u003cbr\u003ephosphate-buffered saline (PBS) containing TMR\u2013dextran\u003cbr\u003e(10\u2009kDa, 50\u2009mg\u2009ml\u22121; D1816, Invitrogen) was infused over\u003cbr\u003e1\u2009min into the SAS at the cisterna magna of *Prox1*\u2013GFP\u003cbr\u003emice. Anaesthetized mice in the prone position were placed\u003cbr\u003eon a stereotaxic frame under a surgical microscope. The head\u003cbr\u003ewa","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #19\u003cbr\u003e\u003cbr\u003e*M. fascicularis* monkeys (7\u201314 years of age), maintained at\u003cbr\u003ethe National Primate Research Center of the Korea Research\u003cbr\u003eInstitute of Bioscience and Biotechnology, were housed\u003cbr\u003eindividually to prevent physical contact and minimize\u003cbr\u003epotential harm during the experiment but had visual and\u003cbr\u003eauditory interactions with neighbouring monkeys. Cage\u003cbr\u003edimensions (60\u2009cm\u2009\u00d7\u200980\u2009cm\u2009\u00d7\u200980\u2009cm) followed the guidelines\u003cbr\u003eof","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #30\u003cbr\u003e\u003cbr\u003eAfter anaesthesia, *Prox1*\u2013GFP adult mice (*n*\u2009=\u20093 males and\u003cbr\u003e*n*\u2009=\u20093 females at 12 weeks of age) and aged mice (*n*\u2009=\u20093\u003cbr\u003emales and *n*\u2009=\u20093 females at 93 weeks of age) were perfused\u003cbr\u003ewith ice-cold PBS. scLVs near the submandibular lymph node\u003cbr\u003eand surrounding tissue were removed and pooled in DMEM\u002fF12\u003cbr\u003emedium (Gibco). The tissues were cut into small pieces and\u003cbr\u003eincubated in dissociation buffer containing","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #17\u003cbr\u003e\u003cbr\u003eCSF drainage can also be increased by using cervical\u003cbr\u003elymphatics as targets of local or systemic pharmacological\u003cbr\u003eagents by exploiting their accessibility in the neck, smooth\u003cbr\u003emuscle coverage and valves that prevent backflow. CSF\u003cbr\u003edrainage through cervical lymphatics can be increased by\u003cbr\u003edirect application of the \u03b11-adrenergic agonist\u003cbr\u003ephenylephrine, nitric oxide donor sodium nitroprusside or\u003cbr\u003eprostaglan","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #7\u003cbr\u003e\u003cbr\u003e**a**, Sequence of intracisternal infusion of 2.5\u2009ml\u003cbr\u003eindocyanine green (ICG) into *M. fascicularis* monkeys over\u003cbr\u003e10\u2009min followed at 30\u2009min by imaging of ICG in the face and\u003cbr\u003eneck. Before infusion, 1.0\u2009ml of CSF was removed at the\u003cbr\u003ecisterna magna over 10\u2009min. **b**\u2013**e**, Images of the face\u003cbr\u003eof monkeys before and after the intracisternal infusion\u003cbr\u003eshowing ICG fluorescence (white) in lymphatics. The whi","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #12\u003cbr\u003e\u003cbr\u003eWe next determined whether CSF drainage could be increased\u003cbr\u003eby manipulating scLV-1 and scLV-2 through the intact skin,\u003cbr\u003ewith the goal of reversing the CSF drainage impairment in\u003cbr\u003eaged mice. These vessels were chosen because of their\u003cbr\u003eaccessibility due to their superficial location in the head\u003cbr\u003eand neck, unlike dcLV. Another feature of scLV-1 and scLV-2\u003cbr\u003ewas the innervation of their smooth muscle cell en","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #4\u003cbr\u003e\u003cbr\u003eThe amount of CSF drainage to individual cervical lymph\u003cbr\u003enodes changed with the conditions. Ligation of dcLV shifted\u003cbr\u003ethe drainage from deep to superficial cervical lymph nodes,\u003cbr\u003eas reflected by reduction in CSF tracer in the deep node and\u003cbr\u003eincrease in the accessory submandibular lymph node (Extended\u003cbr\u003eData Fig. 2a\u2013d). By comparison, ligation of scLVs reduced\u003cbr\u003eoverall CSF drainage to all cervical lymph n","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #2\u003cbr\u003e\u003cbr\u003e**a**,**b**, Drawing (**a**) and flow chart (**b**)\u003cbr\u003eillustrating the complex lymphatic system for CSF drainage\u003cbr\u003efrom meningeal lymphatics through multiple lymphatic\u003cbr\u003epathways to superficial and deep cervical lymph nodes. (1)\u003cbr\u003eMeningeal lymphatics that run along the pterygopalatine and\u003cbr\u003einfraorbital arteries traverse the orbital fissure to join\u003cbr\u003eperiorbital lymphatics that carry CSF through scLV-1 to th","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #29\u003cbr\u003e\u003cbr\u003eMice were anaesthetized by intraperitoneal injection of a\u003cbr\u003eketamine and xylazine mixture and laid in a supine position\u003cbr\u003eon a heated pad. A proximal-to-distal incision was made in\u003cbr\u003ethe skin from the neck to the sternum. A 0.5\u20131.5-mm long\u003cbr\u003esegment of scLVs on both sides was removed with fine forceps\u003cbr\u003eand microscissors and transferred to a dish containing Krebs\u003cbr\u003esolution with 0.5% BSA. The lymphatics were","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #23\u003cbr\u003e\u003cbr\u003eEach 20-stroke session of mechanical stimulation lasted\u003cbr\u003e1\u2009min and consisted of a cycle of 10 downward sweeping-\u003cbr\u003estrokes, with each stroke lasting 2\u2009s, followed by a second\u003cbr\u003ecycle of 10 strokes and then a 20-s rest period (Extended\u003cbr\u003eData Fig. 13c). Three regions of intact skin were stimulated\u003cbr\u003eduring each cycle: (1) from the periorbital area to the\u003cbr\u003emandible (four strokes); (2) from the nasal sidewall t","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #27\u003cbr\u003e\u003cbr\u003eRNA in situ hybridization for *Nos3* and *Postn* mRNA in\u003cbr\u003escLV whole mounts from *Prox1*\u2013GFP mice was performed using\u003cbr\u003ethe RNAscope kit (323280, ACDBio) with target probes to\u003cbr\u003e*Nos3* (443061-C2, ACDBio) and *Postn* (418581-C2, ACDBio),\u003cbr\u003eaccording to the manufacturer\u2019s specifications. scLVs were\u003cbr\u003efixed with 2% PFA overnight at 4\u2009\u00b0C and then permeabilized\u003cbr\u003eby incubation in a mixture of 0.1% Tween 20 in PB","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #1\u003cbr\u003e\u003cbr\u003eFindings that CSF clearance can be manipulated by expanding\u003cbr\u003eor reducing meningeal lymphatic networks have raised new\u003cbr\u003etherapeutic possibilities. Through vascular endothelial\u003cbr\u003egrowth factor-C (VEGF-C)\u2013vascular endothelial growth factor\u003cbr\u003ereceptor 3 (VEGFR3) signalling modulation or photodynamic\u003cbr\u003edestruction, studies have shown that increasing CSF\u003cbr\u003eclearance can reduce the severity of ischaemic or traumat","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #11\u003cbr\u003e\u003cbr\u003eMural cell subclusters were annotated according to previous\u003cbr\u003ework, as lymphatic smooth muscle cells\u003cbr\u003e(*Acta2**+**Myh11**+**Nr4a2**high**Scn3a**high*), blood\u003cbr\u003evessel smooth muscle cells\u003cbr\u003e(*Acta2**+**Myh11**+**Nr4a2**low**Scn3a**low*), *Dcn**high*\u003cbr\u003epericytes (*Vtn**+**Dcn**high*) and *Dcn**low* pericytes\u003cbr\u003e(*Vtn**+**Dcn**low*; Extended Data Fig. 10f and\u003cbr\u003eSupplementary Figs. 14c,e and 16). *Pdgfrb*, a pan-mu","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #22\u003cbr\u003e\u003cbr\u003e*Prox1*\u2013GFP mice were anaesthetized and laid in tion Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #16\u003cbr\u003e\u003cbr\u003e## Discussion  Evidence for reduced or insufficient CSF\u003cbr\u003eoutflow from the SAS in ageing and some neurological\u003cbr\u003econditions has stimulated interest in developing methods for\u003cbr\u003eincreasing CSF drainage through lymphatics. The present\u003cbr\u003estudy documented the feasibility of using a non-invasive\u003cbr\u003emechanical approach for reversing the reduction in CSF\u003cbr\u003edrainage during ageing by increasing CSF outflow through the\u003cbr\u003es","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #10\u003cbr\u003e\u003cbr\u003eThe identity of the six subclusters of LECs was\u003cbr\u003echaracterized and validated by gene expression profiles, in\u003cbr\u003esitu hybridization and immunofluorescence staining. All LEC\u003cbr\u003eclusters had high expression of *Pecam1*, a pan-endothelial\u003cbr\u003ecell marker, and *Prox1*, a pan-LEC marker (Supplementary\u003cbr\u003eFig. 14e). LEC subcluster gene expression profiles were\u003cbr\u003eannotated as collecting LEC (*Apoe**+**Eng**+**Bgn**+*), *","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of Cervical Lymphatics\u003c\u002fb\u003e\u003cbr\u003eChunk #25\u003cbr\u003e\u003cbr\u003eWhole mounts of the periorbital region, nasal mucosa, hard\u003cbr\u003epalate, cribriform plate region and dorsal meninges of\u003cbr\u003e*Prox1*\u2013GFP mice were prepared 20\u2009min, 30\u2009min, 60\u2009min or 4\u003cbr\u003eweeks after intracisternal infusion of TMR\u2013dextran, QDot\u003cbr\u003e705, FluoSpheres or AAV9-VEGF-C. The head and neck were\u003cbr\u003eremoved at the C2 vertebral level immediately after vascular\u003cbr\u003eperfusion of ice-cold PBS followed by 2% paraformalde","\u003cb\u003e\ud83d\udcc4 Increased Csf Drainage By Non Invasive Manipulation Of C FB"},"type":"scatter"},{"customdata":["\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #17\u003cbr\u003e\u003cbr\u003eThis work also raises the question of at what point during\u003cbr\u003eexercise the narrowed attention strategy would best be\u003cbr\u003eimplemented. It is possible, for instance, that individuals\u003cbr\u003ein the beginning stages of goal pursuit might benefit from\u003cbr\u003eexpanded attention. When focusing on single, narrow means to\u003cbr\u003egoal attainment might otherwise be demotivating (e.g., Huang\u003cbr\u003e& Zhang, 2013), such broadened attention coul","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #4\u003cbr\u003e\u003cbr\u003eActivity spaces were derived for each participant from daily\u003cbr\u003epath areas using GPS point data, aggregated for each\u003cbr\u003eindividual (range = 1.47-62.05, M = 13.41, SD = 9.15). This\u003cbr\u003eindexes individuals\u2019 exposure to environments and general\u003cbr\u003esize of potential exercise activity space (Christian, 2012;\u003cbr\u003eDuncan, Regan, & Chaix, 2018; Hirsch, Winters, Clarke, &\u003cbr\u003eMcKay, 2014; Zenk et al., 2011). Results Data trans","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #2\u003cbr\u003e\u003cbr\u003eWith insufficient time being a highly cited barrier to\u003cbr\u003eexercise (Sallis & Hovell, 1990; Sallis et al., 1992),\u003cbr\u003eincreasing efficiency by promoting more intense activity may\u003cbr\u003epromote physical activity. In this work, we tested the\u003cbr\u003eeffectiveness of a visual attention\u2013based strategy that\u003cbr\u003emight increase the frequency and efficiency of activity\u003cbr\u003eoutside of the lab. If it is capable of contributing to\u003cbr\u003elastin","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #10\u003cbr\u003e\u003cbr\u003eFollowing each description, participants indicated how often\u003cbr\u003ethey use each strategy when they are struggling to walk or\u003cbr\u003erun outside. Response options included never (coded as 1),\u003cbr\u003erarely (2), sometimes (3), frequently (4), and always (5).\u003cbr\u003eFive participants chose not to respond to one or both of\u003cbr\u003ethese questions. From these ratings, we computed the\u003cbr\u003edifference score indexing the degree to which people","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #6\u003cbr\u003e\u003cbr\u003eIn our preregistration, we specified that data would only be\u003cbr\u003eanalyzed if respondents passed the attention check, to\u003cbr\u003eremove responses generated by random responders or online\u003cbr\u003ebots; as a result, we analyzed data from 405 individuals who\u003cbr\u003eanswered all questions of interest and met the inclusion\u003cbr\u003ecriteria. Of the participants (216 females; Mage = 49.1, SD\u003cbr\u003e= 16.2), 73% (n = 297) were White, 9% (n = 38) w","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #8\u003cbr\u003e\u003cbr\u003eAs participants found more interesting things in their\u003cbr\u003eneighborhood, the more they agreed that they fix their eyes\u003cbr\u003eon something ahead until they move beyond it and then\u003cbr\u003ereengaged attention narrowly again. Next, we conducted a\u003cbr\u003efactor analysis with varimax rotation on Narrow1, Narrow2,\u003cbr\u003eBroad1, and Broad2. We observed two factors: Both statements\u003cbr\u003edescribing narrowed attention loaded (weights: .69, .8","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #13\u003cbr\u003e\u003cbr\u003eWe expected no differences between attention strategy\u003cbr\u003econditions on time spent walking or number of walks taken\u2014a\u003cbr\u003enull result that would indicate that participants were\u003cbr\u003eequally likely to comply with task instructions regardless\u003cbr\u003eof the attention condition. Moreover, this constraint\u003cbr\u003eallowed us to reduce differences in individuals\u2019 exercise\u003cbr\u003efrequency to isolate the impact of our strategy solely on ef","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #0\u003cbr\u003e\u003cbr\u003eAbstract Rates of physical inactivity continue to rise in\u003cbr\u003ethe United States. With this work, we tested the efficacy of\u003cbr\u003ea strategy affecting the scope of visual attention designed\u003cbr\u003eto promote walking as a form of exercise. Specifically, we\u003cbr\u003eexamined the influence of narrowed attention on the\u003cbr\u003efrequency (Studies 1a, 1b, and 3) and efficiency (Studies 2\u003cbr\u003eand 4) of physical activity in general (Studies 1","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #16\u003cbr\u003e\u003cbr\u003eGoals that are easy rather than hard to visualize facilitate\u003cbr\u003eeffort and commitment, and evidence suggests that perceiving\u003cbr\u003eoneself as closer to the goal strengthens the motivating\u003cbr\u003eeffect of visualization (Cheema & Bagchi, 2011). For\u003cbr\u003einstance, Olympic-level swimmers competing in the\u003cbr\u003epreliminary competitions in the 2004 and 2008 games swam\u003cbr\u003efaster as they swam toward the finish line rather than away\u003cbr\u003ef","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #12\u003cbr\u003e\u003cbr\u003eWe instructed participants to use their assigned attention\u003cbr\u003estrategy. They should continually adopt this strategy as\u003cbr\u003ethey moved through their space. We asked participants to\u003cbr\u003etake these walks in addition to any walking or exercise done\u003cbr\u003eon a regular day, including walking to or from school or\u003cbr\u003ework. We also told them that they should not stop or reduce\u003cbr\u003etheir current exercise routine during the week. F","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #9\u003cbr\u003e\u003cbr\u003eStudy 2 expanded to ask whether narrow attentional scope\u003cbr\u003epromotes efficient physical activity; participants indicated\u003cbr\u003ethe time it would take them to walk 1 mile quickly. As a\u003cbr\u003eprimary hypothesis, we predicted that the more people adopt\u003cbr\u003ea narrowed attentional style while exercising, the greater\u003cbr\u003ethe benefits for physical activity, as indexed by faster\u003cbr\u003ewalking times. As a secondary hypothesis, we prob","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #5\u003cbr\u003e\u003cbr\u003eAll other analyses replicated the previously observed\u003cbr\u003epatterns: effect of weight loss goal, b = 0.71, t(87) =\u003cbr\u003e3.22, p = .002, 95% CI = [0.27, 1.15], effect of narrowed\u003cbr\u003eattentional scope, b = 0.001, t(87) = 0.01, p = .99, 95% CI\u003cbr\u003e= [\u20130.15, 0.16], and the interaction, b = \u22120.13, t(87) =\u003cbr\u003e\u22121.66, p = .10, 95% CI = [\u20130.29, 0.03]; although we note\u003cbr\u003ethat the interaction did not reach significance, the patte","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #7\u003cbr\u003e\u003cbr\u003eParticipants reported the degree to which they agreed that\u003cbr\u003ethis reflected the way in which they look around while\u003cbr\u003ewalking or running outside using a strongly disagree (1) to\u003cbr\u003eneither agree nor disagree (4) to strongly agree (7) scale.\u003cbr\u003eWe also measured agreement with four simple statements\u003cbr\u003edescribing attentional scope. Participants indicated\u003cbr\u003eagreement with statements including, \u201cI look at one or two","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #15\u003cbr\u003e\u003cbr\u003eSpecifically, these studies demonstrated that narrowed\u003cbr\u003eattentional scope facilitated improved physical activity in\u003cbr\u003edaily life by promoting more intense activity (Studies 2 and\u003cbr\u003e4) and repeated engagement in exercises such as walking or\u003cbr\u003erunning over time (Studies 1a, 1b, and 3). Moreover,\u003cbr\u003enarrowed attentional scope may facilitate exercise among at-\u003cbr\u003erisk populations, including racial minorities living","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #14\u003cbr\u003e\u003cbr\u003eTo increase compliance and remind participants of the\u003cbr\u003eattention strategy, the experimenter collected participants\u2019\u003cbr\u003ecell phone numbers. We sent a text message reminder to all\u003cbr\u003eparticipants each morning during the 1 week reminding them\u003cbr\u003eto either \u201czoom in\u201d or \u201clook naturally\u201d as they completed\u003cbr\u003etheir five walks. Participants also completed a daily online\u003cbr\u003esurvey in the week following their lab visit ask","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #3\u003cbr\u003e\u003cbr\u003eParticipants in that study (n = 120) were recruited through\u003cbr\u003ecommunity-based outreach flyers distributed outside of\u003cbr\u003epublic housing developments and in community organizations\u003cbr\u003ein four New York City neighborhoods. Most (80%) of the\u003cbr\u003eparticipants reported living in public housing, and all\u003cbr\u003ereported being low-income. Participants completed a variety\u003cbr\u003eof measures, including questions assessing features of","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #1\u003cbr\u003e\u003cbr\u003ePeople who felt tired judged a finish line as farther away\u003cbr\u003ethan did people who felt full of energy (Cole & Balcetis,\u003cbr\u003e2013). Similarly, individuals with a higher ratio of waist\u003cbr\u003esize to hip circumference believed a finish line was farther\u003cbr\u003eaway than individuals with relatively leaner physical\u003cbr\u003eprofiles (Balcetis et al., 2015). If, as prior findings\u003cbr\u003esuggest, visual experience is implicated in physical","\u003cb\u003e\ud83d\udcc4 Keeping The Goals In Sight\u003c\u002fb\u003e\u003cbr\u003eChunk #11\u003cbr\u003e\u003cbr\u003eMoreover, we assigned all participants the same goal, to\u003cbr\u003eisolate the impact of attentional strategies among all\u003cbr\u003epeople working toward the same objective\u2014to walk 15 min. We\u003cbr\u003eallowed the number of walks to vary but provided a goal\u003cbr\u003erange. We asked participants to walk between 5 and 7 times\u003cbr\u003eover the course of the next week. As frequent physical\u003cbr\u003eactivity confers great health benefits (e.g., Wirth, Atzor"],"hovertemplate":"%{customdata}\u003cextra\u003e\u003c\u002fextra\u003e","legendgroup":"articles","marker":{"color":"#10B981","line":{"color":"white","width":0.5},"opacity":0.85,"size":7},"mode":"markers","name":"\ud83d\udcc4 Keeping The Goals In Sight","x":{"dtype":"f4","bdata":"FBlnQGgTdECWh2pAeVttQFthdkBb329AU7NtQIWfYkANbmNAvQpoQDFGbkB5YXNAPWV2QE69ZkDy6mZAQgh3QN7qZkDWx29A"},"y":{"dtype":"f4","bdata":"f4UMPxYdKj89fAo\u002fr2gNP6dNHD8MrBY\u002fMikTP0PT+T7NVe4+s5QBP7BNEj\u002fcNx8\u002fdvMjP4Lv3j6PtQE\u002fhQQmP27FBz+Nfxs\u002f"},"type":"scatter"},{"customdata":["\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #24\u003cbr\u003e\u003cbr\u003eDuring disease states, the mLV system transports immune\u003cbr\u003ecells from the CNS to the periphery, establishing\u003cbr\u003einteractions with the peripheral immune system. By antigen\u003cbr\u003epresentation, mLVs mediate the entry of central immune cells\u003cbr\u003esuch as dendritic cells (DCs), B lymphocytes, T cells, and\u003cbr\u003eneutrophils into the peripheral immune system, thus inducing\u003cbr\u003eautoreactive T-cell responses, and modulating peripher","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #15\u003cbr\u003e\u003cbr\u003eAs previously mentioned, on the basis of their morphology\u003cbr\u003eand function, mLVs can be categorized into diverse\u003cbr\u003esubclasses, including intracranial mLVs (dorsal mLVs, basal\u003cbr\u003emLVs, basal mLVs adjacent to the skull foramina, skull LVs,\u003cbr\u003eand the NPLP) and cervical LVs (cLVs and LNs). Given the\u003cbr\u003erelative accessibility of dorsal mLVs and CLNs, the majority\u003cbr\u003eof extant studies have focused primarily on these str","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #8\u003cbr\u003e\u003cbr\u003eThe cervical lymphatics, a crucial component in the drainage\u003cbr\u003eof CSF, comprise both medial and lateral cervical\u003cbr\u003elymphatics. Initially, the medial cervical lymphatics are\u003cbr\u003eendowed with semilunar valves spaced at intervals ranging\u003cbr\u003efrom 250 to 750\u2009\u00b5m, which are directed toward the LNs. These\u003cbr\u003evessels are lined with a thick, albeit patchy, layer of\u003cbr\u003ecircular cells expressing \u03b1-smooth muscle actin and are","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #10\u003cbr\u003e\u003cbr\u003eIn recent years, peripheral lymphatic imaging technologies\u003cbr\u003ehave rapidly evolved. Currently, the lymphatic imaging\u003cbr\u003etechniques employed in clinical practice include X-ray\u003cbr\u003elymphography, lymphoscintigraphy, SPECT\u002fCT, near-infrared\u003cbr\u003e(NIR) lymphography, magnetic resonance (MR) lymphography,\u003cbr\u003eand photoacoustic imaging. The advantage of X-ray\u003cbr\u003elymphography lies in the effective tissue penetration of\u003cbr\u003eX-ray wa","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #52\u003cbr\u003e\u003cbr\u003eIn 2024, Peng et al. conducted a study in which MRI was used\u003cbr\u003eto assess the drainage of brain lymphatic vessels adjacent\u003cbr\u003eto the sagittal sinus and mLVs alongside the transverse\u003cbr\u003esinus in patients with chronic migraine compared with\u003cbr\u003ehealthy controls. This study revealed functional impairments\u003cbr\u003ein the mLVs of migraine patients, suggesting that mLV\u003cbr\u003edrainage may play a role in the pathogenesis of migrain","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #25\u003cbr\u003e\u003cbr\u003eNeuroinflammatory diseases, such as MS, are characterized by\u003cbr\u003ethe infiltration of autoreactive T cells into the brain.\u003cbr\u003eHowever, the mechanisms by which T cells acquire their\u003cbr\u003eencephalitogenic phenotype and trigger disease remain\u003cbr\u003eunclear. The first article reporting mLV drainage of T cells\u003cbr\u003ewas published by Louveau et al in 2015. In 2018, a study by\u003cbr\u003eLouveau et al. revealed that immune cells can enter","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #22\u003cbr\u003e\u003cbr\u003eThe relationships between TBI-induced cerebral edema and the\u003cbr\u003elymphatic system (including the glymphatic system and\u003cbr\u003emeningeal lymphatics) were investigated by Hussain et al. in\u003cbr\u003e2023. Using transgenic mice expressing the calcium indicator\u003cbr\u003eGCaMP7 in cortical astrocytes and neurons, the research team\u003cbr\u003eobserved dCLNs post-TBI and discovered that the cellular\u003cbr\u003edebris in these LNs originated from the corte","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #4\u003cbr\u003e\u003cbr\u003emLVs share similarities with peripheral lymphatic vessels\u003cbr\u003ebut also present unique features. Previous studies have\u003cbr\u003eindicated that the function of lymphatic vessels is\u003cbr\u003eassociated with the organ and location in which they are\u003cbr\u003elocated. Given the absence of literature on the\u003cbr\u003eclassification of mLVs, the authors propose a categorization\u003cbr\u003eof meningeal lymphatic system mLVs on the basis of their\u003cbr\u003efunction an","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #29\u003cbr\u003e\u003cbr\u003eEmerging research has underscored the critical role of\u003cbr\u003eneuroinflammation-induced lymphangiogenesis near the\u003cbr\u003ecribriform plate in CNS homeostasis. Specifically, drainage\u003cbr\u003eof CNS-derived antigens and immune cells is facilitated by\u003cbr\u003elymphangiogenesis near the cribriform plate, as indicated by\u003cbr\u003erecent findings. Moreover, a 2019 study by Hsu et al.\u003cbr\u003erevealed that increased lymphangiogenesis near the cribrif","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #56\u003cbr\u003e\u003cbr\u003eIn 2024, Li et al. revealed the therapeutic potential of YZP\u003cbr\u003ein AD, demonstrating its ability to increase lymphatic\u003cbr\u003edrainage in a mouse model. This study highlights the dual\u003cbr\u003eeffects of YZP: restoring AQP4 polarization to facilitate\u003cbr\u003ecerebral fluid balance and inhibiting reactive astrocyte\u003cbr\u003eproliferation to reduce neuroinflammation. Additionally, YZP\u003cbr\u003eexpands the diameter and coverage of mLVs, promoti","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #49\u003cbr\u003e\u003cbr\u003eSepsis-associated encephalopathy (SAE) is an acute form of\u003cbr\u003ebrain dysfunction caused by sepsis. In a study by Huang et\u003cbr\u003eal. in 2023, a model of SAE induced by the intraperitoneal\u003cbr\u003einjection of LPS was established, and meningeal resident\u003cbr\u003eimmune cells and mLVs were examined. Systemic exposure to\u003cbr\u003eLPS induced the recruitment, extravasation, and aggregation\u003cbr\u003eof neutrophils around meningeal blood vessels. A","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #3\u003cbr\u003e\u003cbr\u003eIntracranial mLVs resemble systemic lymphatics in their\u003cbr\u003ecomposition of permeable capillaries and larger collecting\u003cbr\u003evessels but are distinct in their single-layered, loosely\u003cbr\u003econnected endothelial structure without smooth muscle or a\u003cbr\u003econtinuous basement membrane, which is crucial for tissue\u003cbr\u003efluid regulation and immune cell migration. In 2007, Baluk\u003cbr\u003eet al. reported that endothelial junctions in initi","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #2\u003cbr\u003e\u003cbr\u003e**a** A timeline of key breakthroughs and milestone events\u003cbr\u003ein the research history of meningeal lymphatic vessels and\u003cbr\u003emeningeal lymphatic drainage (1628: Gaspare Aselli made the\u003cbr\u003einitial discovery of the lymphatic system; 1787: Giovanni\u003cbr\u003ePaolo Mascagni meticulously documented human dura mater\u2019s\u003cbr\u003emLVs; 2012: Lliff. et al. made the initial discovery of the\u003cbr\u003eglymphatic system; 2015: groundbreaking resear","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #60\u003cbr\u003e\u003cbr\u003eThe study by Yoon et al. in 2024 represents a significant\u003cbr\u003eadvancement in our understanding of lymphatic regulation.\u003cbr\u003eTheir research revealed that low-dose phenylephrine (10\u2009nM)\u003cbr\u003eincreases TMR-dextran fluorescence in dCLNs by 51%,\u003cbr\u003eindicating increased CSF drainage. Similarly, the\u003cbr\u003eapplication of norepinephrine to cervical lymphatics\u003cbr\u003eincreases drainage. These findings suggest that \u03b1-adrenergic\u003cbr\u003eagonists","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #54\u003cbr\u003e\u003cbr\u003eRecent studies have indicated that NETs can induce fibrin\u003cbr\u003edeposition in the lungs and regional LNs of coronavirus\u003cbr\u003edisease 2019 patients. Lymphatic thrombosis has also been\u003cbr\u003ereported in a variety of diseases and conditions, including\u003cbr\u003ecancer, infections, amyloidosis, and poor lymph node\u003cbr\u003eclearance. Zhang et al. discovered the presence of lymphatic\u003cbr\u003ethrombi within mLVs following IVH in a mouse model of","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #48\u003cbr\u003e\u003cbr\u003eIn 2020, Liu et al. reported that RBCs drain through mLVs to\u003cbr\u003eCLNs, whereas SDH leads to reduced expression of LYVE-1,\u003cbr\u003eFOXC2, and VEGF-C in the meninges. In 2024, through a study\u003cbr\u003eon SDH model rats, Yuan et al. discovered that RBCs are\u003cbr\u003edrained into CLNs via mLVs. SDH induces ERK1\u002f2\u003cbr\u003edephosphorylation in mLV endothelial cells, resulting in\u003cbr\u003eprimary mLV destruction and impaired drainage through mLVs.\u003cbr\u003eAt","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #63\u003cbr\u003e\u003cbr\u003eCurrently, our understanding of the developmental\u003cbr\u003emechanisms, structure and distribution of mLVs and their\u003cbr\u003eassociations with their functions remain unclear. Although\u003cbr\u003ethere is yet no evidence to suggest that mLVs develop from\u003cbr\u003eperipheral lymphatic vessels, cranial mLVs develop\u003cbr\u003epostnatally rather than during the embryonic stage. The\u003cbr\u003eVEGFC\u2012VEGFR3 signaling axis is a crucial pathway for the\u003cbr\u003edevelopment","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #41\u003cbr\u003e\u003cbr\u003e## mLVs and CNS diseases  Studies indicate that mLVs are\u003cbr\u003eassociated with neurodegenerative diseases, TBI, hemorrhagic\u003cbr\u003estroke, ischemic stroke, infections, tumors, functional\u003cbr\u003eneurologic disorders, hepatic encephalopathy, and secondary\u003cbr\u003ehydrocephalus. The underlying mechanisms involve the\u003cbr\u003etransport of CSF, metabolic byproducts, and immune cells, in\u003cbr\u003eaddition to interactions between the central and per","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #62\u003cbr\u003e\u003cbr\u003eThe emerging evidence concerning mLVs, summarized above,\u003cbr\u003ehighlights the critical involvement of mLVs in both\u003cbr\u003ephysiological homeostasis and pathological processes.\u003cbr\u003eResearch advancements have lent support to the notion that\u003cbr\u003ethe distribution of mLVs extends far beyond what is\u003cbr\u003ecurrently recognized and that a glymphatic system within the\u003cbr\u003ebrain parenchyma is directly connected to mLVs in the CAV,\u003cbr\u003ewherea","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #68\u003cbr\u003e\u003cbr\u003eTo summarize, a concerted effort should be undertaken as\u003cbr\u003efollows: 1). The mechanisms underlying the development of\u003cbr\u003emLVs and the relationships between the structural diversity\u003cbr\u003eof mLVs and their functions should be ascertained. 2). The\u003cbr\u003eprecise pathways through which CSF, metabolic byproducts,\u003cbr\u003esenescent cells, and immune cells enter mLVs should be\u003cbr\u003eidentified. 3). Understand the potential molecular me","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #28\u003cbr\u003e\u003cbr\u003eThe hubs involved in the interaction between peripheral\u003cbr\u003eimmunity and the CNS through mLVs include the mLV-CLN axis,\u003cbr\u003ethe cribriform plate, and the skull bone marrow. After CNS\u003cbr\u003einjury, brain-derived antigens, injury metabolites (e.g.\u003cbr\u003ecellular debris, proteins, DNA\u002fRNA), and damage-associated\u003cbr\u003emolecular patterns (DAMPs) not only elicit central immune\u003cbr\u003eresponses but also trigger peripheral immune reacti","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #57\u003cbr\u003e\u003cbr\u003ePBM research, particularly that involving light in the NIR\u003cbr\u003eregion, has been substantial, especially regarding the\u003cbr\u003emodulation of mLVs. Studies by Tao et al. have shown that\u003cbr\u003e1070-nanometer NIR light can increase the phagocytosis of A\u03b2\u003cbr\u003eby microglia, improving cognitive functions in AD model\u003cbr\u003emice. Additionally, Hamblin et al. reported that light\u003cbr\u003eranging from 600 to 1100 nanometers can aid in wound hea","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #9\u003cbr\u003e\u003cbr\u003eThe intricate communication between the CNS and the bone\u003cbr\u003emarrow is highlighted by a recent study from Mazzitelli et\u003cbr\u003eal. which underscores the pivotal role of CSF in this\u003cbr\u003einterplay. This study revealed that CSF permeates through\u003cbr\u003edural channels into the cranial bone marrow, where it\u003cbr\u003einfluences a variety of cells within the bone marrow\u003cbr\u003emicroenvironment. In the context of disease-related injury,\u003cbr\u003eCSF-d","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #42\u003cbr\u003e\u003cbr\u003eAD, an age-related neurodegenerative condition, leads to\u003cbr\u003epersonality alterations and marked cognitive impairments,\u003cbr\u003eincluding profound memory loss. The occurrence of AD is\u003cbr\u003eassociated not only with the degeneration of the mLVs\u003cbr\u003estructure and function due to aging but also, as recent\u003cbr\u003estudies suggest, involves the depletion of PBMs, the\u003cbr\u003emutation of the E4 variant of apolipoprotein E (APOE4), and\u003cbr\u003ea decl","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #38\u003cbr\u003e\u003cbr\u003eWithin the CGRP-CLR signaling pathway, activation of the CLR\u003cbr\u003ereceptor stimulates LEC proliferation by activating the\u003cbr\u003edownstream MAPK\u002fERK and pAKT signaling pathways. The\u003cbr\u003eactivation of CLR induces the reorganization of adherens and\u003cbr\u003etight junction proteins in LECs, thereby reducing the\u003cbr\u003epermeability of these junctions. However, the recent\u003cbr\u003eidentification of LYVE-1+ cells within the structure of\u003cbr\u003earachn","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #67\u003cbr\u003e\u003cbr\u003ePreliminary studies using liposome delivery of VEGFC have\u003cbr\u003eincreased the functionality, and NIR has been effectively\u003cbr\u003eemployed to regulate mLV drainage, whereas acoustic and\u003cbr\u003eelectrical stimuli, and CLN massage have shown potential\u003cbr\u003etherapeutic effects. However, most studies are in the early\u003cbr\u003estages regarding the mechanism and evidence level,\u003cbr\u003enecessitating increased clinical involvement. While reports","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #17\u003cbr\u003e\u003cbr\u003eProx1-GFP transgenic mice have played a significant role in\u003cbr\u003estudies investigating the development and distribution\u003cbr\u003echaracteristics, of mLVs. In 2017, Zhong et al. utilized\u003cbr\u003etransgenic mice engineered to express GFP in LECs\u003cbr\u003e(Prox1-GFP) and DsRed in blood endothelial cells\u003cbr\u003e(Flt1-DsRed), resulting in the generation of\u003cbr\u003eProx1-GFP\u002fFlt1-DsRed (PGFD) mice. The inherent fluorescence\u003cbr\u003eof the blood and lymphat","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #46\u003cbr\u003e\u003cbr\u003ePosthemorrhagic hydrocephalus occurs in up to 50% of\u003cbr\u003epatients after ICH, representing a severe complication of\u003cbr\u003eICH. Currently, surgical intervention and thrombolytic\u003cbr\u003epharmacotherapy are the main modalities for treating\u003cbr\u003eposthemorrhagic hydrocephalus. However, invasive CSF\u003cbr\u003eshunting procedures carry the risk of serious complications.\u003cbr\u003eThe outcomes of the highly anticipated IVH Thrombolysis\u003cbr\u003etrial (CLEA","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #23\u003cbr\u003e\u003cbr\u003eCSF-derived red blood cells (RBCs) play a pivotal role in\u003cbr\u003ethe pathogenesis of hemorrhagic stroke. In 1979, Oehmichen\u003cbr\u003eet al. reported that marker-labeled erythrocytes,\u003cbr\u003elymphocytes, and\u002for peritoneal macrophages injected into the\u003cbr\u003ebrain were subsequently identified in CLNs, indicating the\u003cbr\u003epresence of all labeled cell types. Further research by\u003cbr\u003eOehmichen et al. in 1983 corroborated these findings by d","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #16\u003cbr\u003e\u003cbr\u003eCervical LVs include cLVs and LNs. sCLNs are commonly used\u003cbr\u003eto study the drainage mechanism of mLVs: Since sCLNs in mice\u003cbr\u003eare located superficially under the skin on the ventral side\u003cbr\u003eof the neck, the drainage of tracers to the LNs via mLVs can\u003cbr\u003ebe observed via small animal in vivo imaging techniques\u003cbr\u003efollowing tracer injection to assess the extent of mLV\u003cbr\u003edamage. dCLNs are often used to study drainage","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #65\u003cbr\u003e\u003cbr\u003eNoninvasive observation of human mLVs and in vivo\u003cbr\u003eobservation in animals represent future critical areas of\u003cbr\u003eresearch. Owing to the continued development and maturation\u003cbr\u003eof noninvasive observation technologies, we anticipate that\u003cbr\u003ea series of mysteries regarding the drainage of CSF through\u003cbr\u003emLVs will be unraveled. Of particular importance is\u003cbr\u003erevealing whether the primary CSF drainage points in human m","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #35\u003cbr\u003e\u003cbr\u003eThe aforementioned results suggest that intracranial\u003cbr\u003epressure (ICP) and blood pressure correlate with mLV\u003cbr\u003edrainage. Importantly, an elevated ICP commonly occurs in\u003cbr\u003econditions such as hydrocephalus, TBI, ICH, IVH, and\u003cbr\u003eposttumor complications. Whether the observed decrease in\u003cbr\u003emLV drainage in models of these diseases is related to the\u003cbr\u003eregulation of Piezo 1 remains unclear. Recent studies on the\u003cbr\u003eclear","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #55\u003cbr\u003e\u003cbr\u003eThe therapeutic potential of BO, a traditional compound with\u003cbr\u003ea history of medicinal use, in neurological disorders has\u003cbr\u003egarnered increasing interest. This substance has been shown\u003cbr\u003eto exhibit neuroprotective, anti-inflammatory, and\u003cbr\u003eantiepileptic properties, primarily due to its ability to\u003cbr\u003erapidly cross the blood\u2012brain barrier and accumulate in the\u003cbr\u003ebrain at high concentrations. This ability has been","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #27\u003cbr\u003e\u003cbr\u003eMacrophages are key players in maintaining tissue\u003cbr\u003ehomeostasis. In 2022, Drieu et al. identified a subset of\u003cbr\u003ePBMs in mice characterized by high expression levels of\u003cbr\u003eCD163 and LYVE-1, demonstrating that LYVE-1+ PBMs regulate\u003cbr\u003earterial pulsatility, which drives CSF flow. This study\u003cbr\u003eprovides evidence that PBMs modulate the dynamics of CSF\u003cbr\u003eflow, positioning them as novel cellular regulators of CSF\u003cbr\u003ehemod","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #20\u003cbr\u003e\u003cbr\u003e### mLV drainage of metabolic byproducts  ####  *mLVs*\u003cbr\u003edrainage of amyloid-*\u03b2*(*A\u03b2*) proteins  AD is a progressive\u003cbr\u003eneurodegenerative disorder characterized by the accumulation\u003cbr\u003eof A\u03b2 protein, imposing a significant burden on patients and\u003cbr\u003etheir families. Despite the substantial impact of AD,\u003cbr\u003eeffective treatments remain elusive. The clearance of the A\u03b2\u003cbr\u003eprotein is considered a promising therapeutic st","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #51\u003cbr\u003e\u003cbr\u003eTraditional views suggest that owing to the lack of\u003cbr\u003elymphatic drainage in the intracranial space, the immune\u003cbr\u003esurveillance capacity of the CNS against pathogens and\u003cbr\u003etumors is relatively limited. However, recent studies on the\u003cbr\u003echaracteristics of the mLV network revealed a previously\u003cbr\u003eunderappreciated mechanism that may trigger immune responses\u003cbr\u003eagainst antigens expressed within the brain. A study by M","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #31\u003cbr\u003e\u003cbr\u003eThe vascular endothelial growth factor C\u002fvascular\u003cbr\u003eendothelial growth factor receptor 3 (VEGFC\u2012VEGFR3)\u003cbr\u003esignaling pathway has long been considered the primary\u003cbr\u003emolecular driver of lymphangiogenesis. A deficiency in VEGFC\u003cbr\u003eleads to the absence of lymphatic development, and the loss\u003cbr\u003eof VEGFR3 results in primary lymphedema. Early research\u003cbr\u003erevealed the crucial role of calcium binding EGF domain 1\u003cbr\u003e(CCBE1)","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #12\u003cbr\u003e\u003cbr\u003eIn light of the potential side effects associated with the\u003cbr\u003einjection of contrast agents, scientists have recently been\u003cbr\u003einvestigating new noninvasive MRI techniques for the\u003cbr\u003eobservation of mLVs. In 2022, Albayram et al. utilized 3D\u003cbr\u003eT2-FLAIR MRI, leveraging endogenous signals from protein-\u003cbr\u003erich lymphatic fluid rather than exogenous contrast agents,\u003cbr\u003eto map human dural lymphatic structures and revealed","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #44\u003cbr\u003e\u003cbr\u003ePD represents another neurological disorder induced by\u003cbr\u003eaging, afflicting over six million individuals worldwide and\u003cbr\u003esignificantly endangering human health. The clinical\u003cbr\u003etreatment of PD primarily includes pharmacological\u003cbr\u003einterventions administered orally or intravenously. However,\u003cbr\u003ethe blood\u2012brain barrier substantially limits the efficiency\u003cbr\u003eof drug entry into the brain, and current therapeutic pract","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #45\u003cbr\u003e\u003cbr\u003eIn conclusion, the mLV system plays a role in disease\u003cbr\u003eprogression following TBI, and promoting mLV drainage can\u003cbr\u003efacilitate the resolution of edema after TBI. The regulation\u003cbr\u003eof mLVs involves central immunity and communication between\u003cbr\u003ecentral and peripheral immunity. While current research has\u003cbr\u003ereported the role of meningeal lymphatics after TBI,\u003cbr\u003eresearchers have not clearly determined whether the si","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #30\u003cbr\u003e\u003cbr\u003eAdditionally, the success of lymph node-targeted drug\u003cbr\u003edelivery and therapies such as autologous tumor lysate-\u003cbr\u003eloaded dendritic cell vaccine (DCVax-L) has prompted\u003cbr\u003ereflection on the failure of chimeric antigen receptor T\u003cbr\u003e(CAR-T) therapy: the number of T cells in the periphery is\u003cbr\u003eless than the number that can infiltrate the tumor\u003cbr\u003emicroenvironment. The discovery of the ocular lymphatic\u003cbr\u003esystem and the","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #66\u003cbr\u003e\u003cbr\u003eThe injury and regulatory molecular mechanisms of mLVs under\u003cbr\u003eCNS disease conditions will be a research focus for the next\u003cbr\u003edecade. Studies on the injury mechanisms involving mLVs\u003cbr\u003egenerally revolve around the development of LECs and\u003cbr\u003elymphatic valves, with the VEGFC\u2013VEGFR3 signaling pathway at\u003cbr\u003ethe core. On the basis of current research on peripheral\u003cbr\u003elymphatic vessel injury mechanisms, genes such as S","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #5\u003cbr\u003e\u003cbr\u003eIn mice, the mLVs located adjacent to the petrosal sinus and\u003cbr\u003esigmoid sinus at the base of the skull exhibit larger\u003cbr\u003ediameters and an abundance of protruding capillary lymphatic\u003cbr\u003ebranches (primary lymphatic vessels). These capillary\u003cbr\u003elymphatics have blind ends with characteristic oak leaf-\u003cbr\u003eshaped, button-like junctions and are equipped with\u003cbr\u003elymphatic valves but are devoid of smooth muscle coverage\u003cbr\u003e(Fig","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #39\u003cbr\u003e\u003cbr\u003eDespite its simple structure, NO is a multifunctional\u003cbr\u003emolecule that plays an extensive role in various systems,\u003cbr\u003eincluding the cardiovascular system, CNS, reproductive\u003cbr\u003esystem, endocrine system, respiratory system, and digestive\u003cbr\u003esystem. NO is involved in a myriad of cellular signaling\u003cbr\u003epathways, and affects numerous cellular processes, with\u003cbr\u003ecomplex regulatory mechanisms. Studies have shown that hemog","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #36\u003cbr\u003e\u003cbr\u003eERK1\u002f2 are dual-specificity kinases that participate in\u003cbr\u003evarious biological processes, including transcription,\u003cbr\u003eproliferation, and cell adhesion. The ERK1\u002f2 signaling\u003cbr\u003ecascade has been proven to be involved in lymphangiogenesis.\u003cbr\u003eThe inactivation of ERK1\u002f2 has been shown to disrupt\u003cbr\u003eintercellular junctions, characterized by decreased\u003cbr\u003eexpression of VE-cadherin. Endothelial junctions are crucial\u003cbr\u003efor mai","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #0\u003cbr\u003e\u003cbr\u003e# Meningeal lymphatic drainage: novel insights into central\u003cbr\u003enervous system disease  **Source:** [https:\u002f\u002fwww.nature.com\u002f\u003cbr\u003earticles\u002fs41392-025-02177-\u003cbr\u003ez](https:\u002f\u002fwww.nature.com\u002farticles\u002fs41392-025-02177-z)  ---\u003cbr\u003e## Abstract  In recent years, increasing evidence has\u003cbr\u003esuggested that meningeal lymphatic drainage plays a\u003cbr\u003esignificant role in central nervous system (CNS) diseases.\u003cbr\u003eStudies have indicated that","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #13\u003cbr\u003e\u003cbr\u003eNIR light sheet microscopy within the NIR-II spectrum\u003cbr\u003e(1000\u20131700\u2009nm) represents a novel imaging modality\u003cbr\u003eextensively applied to observe deep tissues in small\u003cbr\u003eanimals, including brain tissues, and is utilized to\u003cbr\u003evisualize immune cells within LNs. This technique allows for\u003cbr\u003edeep tissue penetration and yields images with high\u003cbr\u003eresolution. NIR-II nanoprobes enable dynamic observations of\u003cbr\u003ethe regulation","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #53\u003cbr\u003e\u003cbr\u003eThe regulation of mLVs can be classified on the basis of the\u003cbr\u003esite of modulation into the regulation of mLVs and cerical\u003cbr\u003eLVs. Pathways can be divided according to their mechanism of\u003cbr\u003econtrol into pharmacological methods and physical methods of\u003cbr\u003eregulation. Pharmacological regulation comprises agents such\u003cbr\u003eas VEGFC, BO, Yoda 1, dopexamine, vitamin D, yuanzhi powder\u003cbr\u003e(YZP) and DNAse I. Physical methods f","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #11\u003cbr\u003e\u003cbr\u003eRecent studies have shown that the use of gadobutrol-\u003cbr\u003eenhanced MRI following an intravenous injection of\u003cbr\u003egadobutrol is an effective method for observing mLVs.\u003cbr\u003eGadobutrol, a gadolinium-based contrast agent, is highly\u003cbr\u003epermeable and can penetrate the permeable endothelial\u003cbr\u003ebarrier of lymphatic vessels. On cranial and spinal MR\u003cbr\u003eimages, tissue enhancement effects are typically visible\u003cbr\u003ewithin approximatel","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #59\u003cbr\u003e\u003cbr\u003eBreathing has been recognized to actively influence CSF flow\u003cbr\u003ewithin the brain, with implications for the homeostasis of\u003cbr\u003eCNS fluids. In a pivotal study conducted in 2023, Ozturk et\u003cbr\u003eal. explored the impact of assisted respiration through\u003cbr\u003econtinuous positive airway pressure (CPAP) on lymphatic\u003cbr\u003efunction in anesthetized, spontaneously breathing rodent\u003cbr\u003emodels. These findings revealed that CPAP increased","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #1\u003cbr\u003e\u003cbr\u003eThe debate over the existence of a lymphatic system within\u003cbr\u003ethe central nervous system (CNS) has persisted for more than\u003cbr\u003etwo centuries. As early as 1787, the Italian anatomist\u003cbr\u003eGiovanni Paolo Mascagni provided a detailed description of\u003cbr\u003emeningeal lymphatic vessels (mLVs) in the human dura mater.\u003cbr\u003eHowever, his work was not widely disseminated or recognized\u003cbr\u003ewithin the scientific community, as it was not","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #33\u003cbr\u003e\u003cbr\u003eThe development of lymphatic valves is regulated by a\u003cbr\u003evariety of hemodynamic factors, and is closely associated\u003cbr\u003ewith key regulators such as Prox1. The transcriptional\u003cbr\u003eregulators that drive valve development and are modulated by\u003cbr\u003eshear stress include Foxc2, and Gata2. (1) Gata2: Research\u003cbr\u003eby Feng et al. published in 2024 revealed that genes\u003cbr\u003eassociated with lymphatic vessel development and function, s","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #6\u003cbr\u003e\u003cbr\u003eThe cribriform plate represents a significant pathway for\u003cbr\u003eCSF outflow within the mouse skull. However, the role of\u003cbr\u003emLVs in mediating this drainage through the cribriform plate\u003cbr\u003eremains to be conclusively established. Intriguingly,\u003cbr\u003eethmoidal mLVs form dorsal connections with rostral\u003cbr\u003eprojections of superior olfactory sinus mLVs and ventral\u003cbr\u003econnections with CAV mLVs. Ethmoid mLVs display no\u003cbr\u003eassociatio","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #26\u003cbr\u003e\u003cbr\u003eNeutrophils perform a wide range of immune functions,\u003cbr\u003eincluding active phagocytosis of invading microorganisms,\u003cbr\u003eincreased recruitment of local immune cells, and passive\u003cbr\u003emodulation of cytokine and growth factor secretion at sites\u003cbr\u003eof inflammation. A study by Cugurra et al. published in 2021\u003cbr\u003erevealed the presence of a population of monocytes and\u003cbr\u003eneutrophils in the meninges of mice, which were not sup","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #18\u003cbr\u003e\u003cbr\u003eRecent studies have shown that NIR imaging and photoacoustic\u003cbr\u003eimaging techniques can be used to observe dynamic drainage\u003cbr\u003ein mLVs in mice, but these modalities have not been reported\u003cbr\u003ein human mLV studies to date. NIR and photoacoustic imaging\u003cbr\u003emay become potential noninvasive methods for observing human\u003cbr\u003emLVs in the future. Owing to equipment limitations and other\u003cbr\u003efactors in animal studies, ex vivo ti","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #32\u003cbr\u003e\u003cbr\u003eMolecular pathways involved in the mechanism of mLV injury.\u003cbr\u003e**a** CCBE1 is involved in the processing of VEGFC, which is\u003cbr\u003eessential for the initial steps of lymphangiogenesis. The\u003cbr\u003eabsence of CCBE1 and VEGFC leads to impaired development and\u003cbr\u003edysfunction of meningeal lymphatic vessels. **b** FOXC2 is\u003cbr\u003eone of the main promoters of lymphatic valve development,\u003cbr\u003ewhile the forkhead transcription factor FOX","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #7\u003cbr\u003e\u003cbr\u003eDespite the classical theory that mLVs predominantly reside\u003cbr\u003eadjacent to dural venous sinuses since their discovery,\u003cbr\u003eemergent research suggests a more extensive distribution\u003cbr\u003ethroughout the dura mater. Specifically, recent research by\u003cbr\u003eVera Quesada et al. indicated that mLVs in the human dura\u003cbr\u003emater are more extensively distributed in areas of the dura\u003cbr\u003emater that are distant from the venous sinuses (F","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #14\u003cbr\u003e\u003cbr\u003eIn conclusion, the invasiveness and low image resolution of\u003cbr\u003etwo-photon imaging have promoted a preference for NIR\u003cbr\u003eimaging and photoacoustic imaging techniques are currently\u003cbr\u003ethe preferred methods for noninvasive observation of mLVs in\u003cbr\u003emice. Owing to current limitations in equipment, MRI\u003cbr\u003etechniques are not yet viable options for observing mLVs in\u003cbr\u003emice. Although recent reports have identified the dra","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #61\u003cbr\u003e\u003cbr\u003eRecent advancements in the treatment of neurodegenerative\u003cbr\u003ediseases have highlighted innovative surgical approaches\u003cbr\u003ethat target meningeal lymphatic drainage pathways. In 2024,\u003cbr\u003eXie et al. successfully performed microsurgical LVA on 50\u003cbr\u003epatients with AD. Patients\u2019 behavior, cognitive function,\u003cbr\u003eand memory are significantly improved as assessed by the\u003cbr\u003eMini-Mental State Examination and the Montreal Cogni","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #37\u003cbr\u003e\u003cbr\u003eCalcitonin gene-related peptide (CGRP) is a potent\u003cbr\u003evasodilatory neuropeptide released from trigeminal C-fibers\u003cbr\u003eduring migraine that controls pain through the regulation of\u003cbr\u003eCSF outflow and neuroinflammation and is a neurotransmitter\u003cbr\u003ein both the central and peripheral nervous systems. The CGRP\u003cbr\u003ereceptor is a heterodimer comprising the calcitonin\u003cbr\u003ereceptor-like receptor (gene: Calcrl, protein: CLR) and","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #64\u003cbr\u003e\u003cbr\u003eIn the study of the function and mechanisms of mLVs, there\u003cbr\u003eare still numerous mysteries regarding the metabolites they\u003cbr\u003edrain, their interactions with different cell types, and\u003cbr\u003etheir role under pathological conditions. Metabolic\u003cbr\u003ebyproducts drained by mLVs include A\u03b2, tau proteins, \u03b1-syn,\u003cbr\u003eTDP-43, and glutamate neuronal debris, among others.\u003cbr\u003eHowever, the mechanisms by which these metabolites enter mL","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #40\u003cbr\u003e\u003cbr\u003eThe formation of lymphatic vessels primarily encompasses\u003cbr\u003efour processes: proliferation, germination, migration, and\u003cbr\u003ethe formation of vascular structures. While mLVs share some\u003cbr\u003esimilarities with the developmental pathways of peripheral\u003cbr\u003elymphatics, differences also exist. For example, during\u003cbr\u003eperipheral lymphatic development, the interactions of VEGFC\u003cbr\u003eand VEGFD with their receptor VEGFR3 serve as the","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #34\u003cbr\u003e\u003cbr\u003eCraniosynostosis (CS) is characterized by the premature\u003cbr\u003efusion of one or multiple cranial sutures, leading to\u003cbr\u003edeformities in cranial bone development and associated\u003cbr\u003eincreased intracranial pressure (IICP). Primary expansion of\u003cbr\u003ethe skull occurs at the sutures between bones, which is also\u003cbr\u003econcurrent with the development of mLVs. In 2022, Xiang et\u003cbr\u003eal. reported that IICP reduces the drainage of dCLNs a","\u003cb\u003e\ud83d\udcc4 Meningeal Lymphatic Drainage Novel Insights Into Central Nervous System Disease\u003c\u002fb\u003e\u003cbr\u003eChunk #50\u003cbr\u003e\u003cbr\u003eA study by Li et al. in 2022 investigated the impact of\u003cbr\u003eneurotropic viruses within the CNS of mice\u2014specifically,\u003cbr\u003eZika virus, Japanese encephalitis virus, rabies virus,\u003cbr\u003eherpes simplex virus I, and vesicular stomatitis virus\u2014on\u003cbr\u003ethe proliferation of intracranial mLVs. mLVs, which serve as\u003cbr\u003edrainage pathways for viruses from the CNS to dCLNs, exhibit\u003cbr\u003eimpaired function due to these viral infections. Res","\u0
